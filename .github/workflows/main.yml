name: PhylUp build and tests

on:
  push:
    branches:
      - main
      - dev_update2025

jobs:
  run_python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
        with:
          python-version: '3.12'
          architecture: 'x64'
#      - uses: conda-incubator/setup-miniconda@v2
#        with:
#          installer-url: https://github.com/conda-forge/miniforge/releases/download/4.8.3-2/Miniforge-pypy3-4.8.3-2-Linux-x86_64.sh
#          allow-softlinks: true
#          show-channel-urls: true
#          use-only-tar-bz2: true
          #conda install -c bioconda blast

      #- uses: mkandziora/PhylUp@dev
      - name: Install dependencies
        run: |
              python -m pip install --upgrade pip
              pip install pytest pytest-cov pytest-xdist codecov
              pip install -r requirements.txt
              pip install -e .

              wget ftp://ftp.ncbi.nlm.nih.gov/blast/executables/blast+/2.9.0/ncbi-blast-2.9.0+-x64-linux.tar.gz
              tar -xvf ncbi-blast-2.9.0+-x64-linux.tar.gz
              #cd ncbi-blast-2.9.0+/bin/
              #echo PATH="$PATH:$(pwd)" >> $GITHUB_PATH
              #cd ..
              #cd ..
              # Add the bin directory using full path
              BLAST_PATH="$GITHUB_WORKSPACE/ncbi-blast-2.9.0+/bin"
              echo "$BLAST_PATH" >> $GITHUB_PATH
              chmod +x $GITHUB_WORKSPACE/ncbi-blast-2.9.0+/bin/*


              mkdir PaPaRa
              cd PaPaRa
              wget https://cme.h-its.org/exelixis/resource/download/software/papara_nt-2.5-static_x86_64.tar.gz
              gunzip  -cd papara_nt-2.5-static_x86_64.tar.gz | (tar xvf - )
              chmod +x papara_static_x86_64
              #echo PATH="$PATH:$(pwd)" >> $GITHUB_PATH
              cd ..
              papara_PATH="$GITHUB_WORKSPACE/PaPaRa"
              echo "$papara_PATH" >> $GITHUB_PATH
      - name: download data
        run: |
            wget 'https://ftp.ncbi.nlm.nih.gov/pub/taxonomy/taxdump.tar.gz'
            gunzip  -cd taxdump.tar.gz | (tar xvf - names.dmp nodes.dmp)
            mv *.dmp ./data/
            mkdir tests/output
            mkdir tests/output/test_runs
            
      - name: Verify BLAST
        run: |
            which blastn
            blastn -version
            which makeblastdb
            makeblastdb -version
            
      - name: Test with pytest
        run: |
          # Update PATH for this shell
          export PATH="${GITHUB_WORKSPACE}/ncbi-blast-2.9.0+/bin:${GITHUB_WORKSPACE}/PaPaRa:$PATH"
      
          # Optional sanity check
          which blastn
          blastn -version
          which makeblastdb
          makeblastdb -version
          which papara_static_x86_64
      
          # Run tests
          pytest --cov=PhylUp tests/test_*

  #     - name: Test with pytest
   #      run: |
  # #           export PATH="$GITHUB_WORKSPACE/ncbi-blast-2.9.0+/bin:$PATH"
   #          pytest --cov=PhylUp tests/test_*

#      - name: upload coverage
#        run: |
#            codecov
#            curl -s https://codecov.io/bash | bash

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v1


